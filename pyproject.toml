[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplier-allocation"
version = "0.1.0"
description = "Supplier selection and order allocation with quantity discounts, capacity and risk limits (MILP)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arshdeep Singh" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyomo>=6.7",
    "highspy>=1.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_allocation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
